<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15161d"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8620"/>
    </linearGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(244, 229, 184, 0.7)"/>
      <stop offset="50%" stop-color="rgba(212, 175, 55, 0.3)"/>
      <stop offset="100%" stop-color="rgba(212, 175, 55, 0.6)"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212, 175, 55, 0.22)"/>
      <stop offset="100%" stop-color="rgba(212, 175, 55, 0)"/>
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="48" height="48" rx="8" fill="url(#centerGlow)"/>

  <!-- Monogram "HM" Architectural Geometry -->
  <g fill="url(#goldGrad)">
    <!-- H Left Stem -->
    <rect x="14.5" y="18" width="4.5" height="28" rx="1.2"/>
    <!-- H Right Stem -->
    <rect x="26.5" y="18" width="4.5" height="28" rx="1.2"/>
    <!-- H Horizontal Bar -->
    <rect x="17" y="30" width="11" height="4" rx="0.8"/>

    <!-- M Right Vertical Stem -->
    <rect x="45" y="18" width="4.5" height="28" rx="1.2"/>
    <!-- M Left Angle Diagonal -->
    <path d="M 28.5 18 L 38 35 L 40.5 35 L 31.5 18 Z"/>
    <!-- M Right Angle Diagonal -->
    <path d="M 47.5 18 L 38 35 L 40.5 35 L 50 18 Z"/>
  </g>

  <!-- Precision Gold Accent Dot -->
  <circle cx="47.25" cy="13.5" r="2.2" fill="#faecc8"/>
</svg>